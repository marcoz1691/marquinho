<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 64" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Sofía PreFirma</title>
  <desc id="descripcion">Una S conversacional en movimiento con un punto de presencia, símbolo del agente digital Sofía.</desc>
  <defs>
    <linearGradient id="sofia-fondo" x1="7" y1="5" x2="57" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7657F6"/>
      <stop offset=".52" stop-color="#5268F4"/>
      <stop offset="1" stop-color="#2489E8"/>
    </linearGradient>
    <linearGradient id="sofia-brillo" x1="16" y1="15" x2="49" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8FFFB"/>
    </linearGradient>
  </defs>

  <!-- Símbolo: una conversación que avanza y forma la S de Sofía. -->
  <rect x="2" y="2" width="60" height="60" rx="19" fill="url(#sofia-fondo)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="18.25" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="1.5"/>
  <path d="M45.8 18.5C42.5 15.4 38 14 32.7 14c-8.1 0-13.8 3.8-13.8 9.3 0 5.8 5.1 7.5 13.6 8.7 8.2 1.2 12.6 3 12.6 8.8 0 5.7-5.5 9.5-13.3 9.5-5.9 0-10.9-2-14.6-5.8" fill="none" stroke="url(#sofia-brillo)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M17.2 44.5v7.1l6.7-3.7" fill="none" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="47.8" cy="16.2" r="5.2" fill="#70E9D2"/>
  <circle cx="47.8" cy="16.2" r="2" fill="#FFFFFF"/>

  <!-- Wordmark. Colores fijos para que conserve identidad al usarse como imagen. -->
  <text x="77" y="35" fill="#171B35" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="780" letter-spacing="-1">Sofía</text>
  <text x="137" y="35" fill="#526079" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="620" letter-spacing="-.45">PreFirma</text>
  <text x="78" y="51" fill="#66738B" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" font-weight="720" letter-spacing="1.65">AGENTE DIGITAL</text>
  <circle cx="163.5" cy="48.2" r="2.5" fill="#70DCC9"/>
</svg>
